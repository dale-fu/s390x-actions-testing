name: bpftrace-test

on:
  workflow_dispatch:

jobs:
  bpftrace-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-s390x
            llvm: 18
          - runner: ubuntu-26.04-s390x
            llvm: 21
          - runner: ubuntu-24.04-s390x-vm
            llvm: 18
          - runner: ubuntu-26.04-s390x-vm
            llvm: 21
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: bpftrace/bpftrace
          submodules: true
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bpftool 2>/dev/null || sudo apt-get install -y linux-tools-common
          sudo apt-get install -y \
            binutils-dev \
            bison \
            build-essential \
            clang \
            cmake \
            flex \
            libbpf-dev \
            libbpfcc-dev \
            libcereal-dev \
            libdw-dev \
            libelf-dev \
            libiberty-dev \
            libpcap-dev \
            libclang-dev \
            libclang-cpp-dev \
            llvm-dev \
            pahole \
            python3 \
            python3-looseversion \
            xxd \
            zlib1g-dev \
            zip \
            libgtest-dev \
            googletest \
            libgmock-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DLLVM_DIR=/usr/lib/llvm-${{ matrix.llvm }}/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-${{ matrix.llvm }}/lib/cmake/clang

      - name: Build
        run: make -C build -j"$(nproc)"

      - name: Unit tests
        run: ./build/tests/bpftrace_test
        continue-on-error: true

      - name: Self tests
        run: sudo ./build/tests/self-tests.sh
        continue-on-error: true

      - name: Tools parsing tests
        run: TOOLS_TEST_DISABLE=dcsnoop.bt ./build/tests/tools-parsing-test.sh
        continue-on-error: true

      - name: Runtime tests
        run: sudo ./build/tests/runtime-tests.sh --filter='-^basic\.defines work$:-^interop\.interop struct pointer return type$:-^call\.join_multi_arg$'
        continue-on-error: true
