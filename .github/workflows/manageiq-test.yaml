# This workflow to test mock command with regards to the issue
# below where AppArmor is blocking specific operations.
# Container runners are expected to fail here: AppArmor blocks the privileged
# Docker operations mock needs. VM runners should pass.
# Issue: https://github.com/IBM/actionspz/issues/78
name: manageiq-test

on:
  workflow_dispatch:

jobs:
  manageiq-test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04-s390x
          - ubuntu-22.04-s390x-vm
          - ubuntu-24.04-s390x
          - ubuntu-24.04-s390x-vm
          - ubuntu-26.04-s390x
          - ubuntu-26.04-s390x-vm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            -f test-files/manageiq.Dockerfile \
            -t mock:latest \
            .

      # The image runs as the unprivileged 'builder' user in the mock group: mock refuses to run
      # as root, and refuses to be invoked directly as non-root. It has to go through the
      # /usr/bin/mock consolehelper wrapper, which escalates via PAM.
      - name: Test mock command
        run: |
          docker run --privileged --rm mock:latest mock -r fedora-43-s390x --init
