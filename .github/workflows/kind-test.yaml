# This workflow tests building and running a Kind (Kubernetes in Docker) cluster.
# Kind does not publish prebuilt binaries for IBM platforms, so we build from source
# using the linux-on-ibm-z community build script and verification steps.
#
# Tracks Kind 0.33.0. build_kind.sh builds the kind binary plus the base, kindnetd,
# local-path-provisioner and local-path-helper images, so the image tags loaded below
# must match the ones that script builds.
# Ref: https://github.com/linux-on-ibm-z/docs/wiki/Building-Kind
# Issue: https://github.com/IBM/actionspz/issues/49
name: kind-test

on:
  workflow_dispatch:

jobs:
  kind-test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04-s390x-vm
          - ubuntu-24.04-s390x-vm
          - ubuntu-26.04-s390x-vm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Build Kind from source
        run: |
          wget https://raw.githubusercontent.com/linux-on-ibm-z/scripts/master/Kind/0.33.0/build_kind.sh

          bash build_kind.sh -y

      - name: Build cross image
        env:
          PATCH_URL: https://raw.githubusercontent.com/linux-on-ibm-z/scripts/master/Kind/0.33.0/patch
          REGISTRY: local
        run: |
          git clone -b v0.19.0 https://github.com/kubernetes/release.git
          cd release
          curl -s $PATCH_URL/release.patch | git apply --ignore-whitespace -
          docker buildx inspect
          cd images/build/cross/
          TARGETPLATFORM=s390x make container

      - name: Build node image
        env:
          REGISTRY: local
        run: |
          export PATH=${PWD}/kind/bin:$PATH
          git clone -b v1.36.1 https://github.com/kubernetes/kubernetes.git
          cd kubernetes
          sed -i 's,v1.36.0-go1.26.2-bullseye.0,v1.36.0-go1.26.2-trixie.0,g' build/build-image/cross/VERSION
          docker buildx use default
          KUBE_CROSS_IMAGE=${REGISTRY}/kube-cross-s390x kind build node-image
          docker tag kindest/node:latest ${REGISTRY}/kindest/node:latest

      - name: Create cluster and verify
        env:
          REGISTRY: local
        run: |
          export PATH=${PWD}/kind/bin:$PATH

          kind create cluster --image=${REGISTRY}/kindest/node:latest

          # kind's manifests reference upstream tags that have no s390x build,
          # while build_kind.sh produces s390x images under different tags.
          # Retag the local builds to whatever the cluster actually asks for.
          want_kindnet=$(docker exec kind-control-plane kubectl get ds -n kube-system kindnet \
            -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's,^docker.io/,,')
          want_lpp=$(docker exec kind-control-plane kubectl get deploy -n local-path-storage local-path-provisioner \
            -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's,^docker.io/,,')
          echo "kindnet wants: ${want_kindnet}"
          echo "local-path-provisioner wants: ${want_lpp}"

          docker tag kindest/kindnetd:v20260528-9350166c "${want_kindnet}"
          docker tag kindest/local-path-provisioner:v20260521-9fb22683 "${want_lpp}"

          kind load docker-image "${want_kindnet}"
          kind load docker-image "${want_lpp}"
          kind load docker-image kindest/local-path-helper:v20260131-7181c60a

          docker exec kind-control-plane kubectl rollout restart daemonset/kindnet -n kube-system

          echo "Waiting for node to be Ready..."
          docker exec kind-control-plane kubectl wait --for=condition=Ready nodes --all --timeout=300s

          echo "Waiting for kindnet rollout to finish..."
          docker exec kind-control-plane kubectl rollout status daemonset/kindnet -n kube-system --timeout=300s

          echo "Waiting for pods to be Ready..."
          docker exec kind-control-plane kubectl wait --for=condition=Ready pods --all -A --timeout=300s

          docker exec kind-control-plane kubectl get nodes
          docker exec kind-control-plane kubectl get pods -A
          echo "Kind cluster: OK"

      - name: Cleanup
        if: always()
        run: |
          export PATH=${PWD}/kind/bin:$PATH
          kind delete cluster 2>/dev/null || true
